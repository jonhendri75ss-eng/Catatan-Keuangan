<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="My Finance">
    
    <!-- Web Manifest -->
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIk15IEZpbmFuY2UiLAogICJzaG9ydF9uYW1lIjogIk15RmluYW5jZSIsCiAgInN0YXJ0X3VybCI6ICIuIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjMjU2M2ViIiwKICAidGhlbWVfY29sb3IiOiAiIzI1NjNlYiIsCiAgImljb25zIjogWwogICAgewogICAgICAic3JjIjogImh0dHBzOi8vY2RuLWljb25zLXBuZy5mbGF0aWNvbi5jb20vNTEyLzI5MTEvMjkxMTIxNS5wbmciLAogICAgICAic2l6ZXMiOiAiNTEyeDUxMiIsCiAgICAgICJ0eXBlIjogImltYWdlL3BuZyIKICAgIH0KICBdCn0=">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s ease; }
        .glass-card { backdrop-filter: blur(10px); transition: all 0.3s ease; }
        header { padding-top: env(safe-area-inset-top); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 min-h-screen pb-12 text-slate-900 dark:text-slate-100">

    <!-- Sync Banner -->
    <div id="sync-banner" class="bg-blue-600 text-white text-[10px] py-1 px-4 flex justify-between items-center">
        <span id="sync-status" class="flex items-center gap-1">
            <i data-lucide="database" class="w-3 h-3"></i> Mode: Lokal & Cloud
        </span>
        <span id="session-display" class="font-mono">ID: Loading...</span>
    </div>

    <!-- Header -->
    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 p-2 rounded-lg text-white">
                    <i data-lucide="wallet"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight">My <span class="text-blue-600">Finance</span></h1>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="shareSession()" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-full" title="Sinkronkan HP Lain">
                    <i data-lucide="share-2" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 mt-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Panel Kiri: Form -->
        <div class="lg:col-span-1 space-y-6">
            <section class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
                <h2 id="form-title" class="text-lg font-semibold mb-4">Catat Transaksi</h2>
                <input type="hidden" id="edit-id">
                
                <div class="space-y-4">
                    <input type="text" id="item-name" placeholder="Nama Barang" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 outline-none focus:ring-2 focus:ring-blue-500">
                    
                    <div class="grid grid-cols-2 gap-4">
                        <select id="type" class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 outline-none">
                            <option value="income">Masuk</option>
                            <option value="expense" selected>Keluar</option>
                        </select>
                        <select id="category" class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 outline-none">
                            <option value="Wajib">Wajib</option>
                            <option value="Hiburan">Hiburan</option>
                            <option value="Investasi">Investasi</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                    </div>

                    <input type="number" id="amount" placeholder="Jumlah (Rp)" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 outline-none">

                    <button onclick="addTransaction()" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-lg transition-all active:scale-95">
                        Simpan Transaksi
                    </button>
                </div>
            </section>
        </div>

        <!-- Panel Kanan: Dashboard -->
        <div class="lg:col-span-2 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-100 dark:border-slate-700">
                    <p class="text-slate-500 text-xs font-bold uppercase">Saldo</p>
                    <p id="balance" class="text-2xl font-bold text-blue-600">Rp 0</p>
                </div>
                <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-100 dark:border-slate-700">
                    <p class="text-slate-500 text-xs font-bold uppercase">Pengeluaran</p>
                    <p id="total-expense" class="text-2xl font-bold text-rose-600">Rp 0</p>
                </div>
                <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-100 dark:border-slate-700 flex items-center justify-center">
                    <button onclick="exportToPDF()" class="text-xs bg-slate-100 dark:bg-slate-700 px-4 py-2 rounded-lg hover:bg-blue-50">Cetak PDF</button>
                </div>
            </div>

            <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-100 dark:border-slate-700 overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 dark:bg-slate-900 text-slate-500 text-xs uppercase font-bold">
                        <tr>
                            <th class="px-6 py-4">Barang</th>
                            <th class="px-6 py-4">Jumlah</th>
                            <th class="px-6 py-4 text-right">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="transaction-list" class="divide-y divide-slate-100 dark:divide-slate-700"></tbody>
                </table>
                <div id="empty-state" class="p-12 text-center text-slate-400 hidden">Belum ada transaksi.</div>
            </div>
        </div>
    </main>

    <script>
        // Logika Penyimpanan Lokal + Identitas Sesi
        const urlParams = new URLSearchParams(window.location.search);
        let syncId = urlParams.get('sync') || localStorage.getItem('sync_id') || Math.random().toString(36).substring(2, 9);
        localStorage.setItem('sync_id', syncId);
        document.getElementById('session-display').innerText = `ID: ${syncId}`;

        // Load data dari LocalStorage saat buka pertama kali agar cepat (Offline Ready)
        let transactions = JSON.parse(localStorage.getItem(`finance_data_${syncId}`)) || [];

        function addTransaction() {
            const name = document.getElementById('item-name').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const type = document.getElementById('type').value;
            const category = document.getElementById('category').value;

            if (!name || !amount) return alert("Isi data dengan lengkap!");

            const newTransaction = {
                id: Date.now(),
                name,
                amount,
                type,
                category,
                date: new Date().toLocaleDateString('id-ID')
            };

            transactions.unshift(newTransaction);
            saveData();
            updateUI();
            clearForm();
        }

        function saveData() {
            // Simpan ke memori HP agar tidak hilang saat apps ditutup
            localStorage.setItem(`finance_data_${syncId}`, JSON.stringify(transactions));
            
            // Catatan: Jika ingin sinkron cloud otomatis di GitHub, 
            // Anda bisa tambahkan Fetch API ke Firebase di sini.
        }

        function deleteTransaction(id) {
            transactions = transactions.filter(t => t.id !== id);
            saveData();
            updateUI();
        }

        function updateUI() {
            const list = document.getElementById('transaction-list');
            list.innerHTML = '';
            
            let bal = 0, exp = 0;

            transactions.forEach(t => {
                if (t.type === 'income') bal += t.amount;
                else { bal -= t.amount; exp += t.amount; }

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="px-6 py-4">
                        <div class="text-sm font-medium">${t.name}</div>
                        <div class="text-[10px] opacity-50">${t.date} • ${t.category}</div>
                    </td>
                    <td class="px-6 py-4 font-bold ${t.type === 'income' ? 'text-emerald-600' : 'text-rose-600'}">
                        Rp ${t.amount.toLocaleString('id-ID')}
                    </td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="deleteTransaction(${t.id})" class="text-rose-500 p-2">✕</button>
                    </td>
                `;
                list.appendChild(row);
            });

            document.getElementById('balance').innerText = `Rp ${bal.toLocaleString('id-ID')}`;
            document.getElementById('total-expense').innerText = `Rp ${exp.toLocaleString('id-ID')}`;
            document.getElementById('empty-state').classList.toggle('hidden', transactions.length > 0);
        }

        function shareSession() {
            const shareUrl = window.location.origin + window.location.pathname + '?sync=' + syncId;
            navigator.clipboard.writeText(shareUrl);
            alert("Link sinkronisasi disalin! Kirim ke HP lain agar data sama.");
        }

        function clearForm() {
            document.getElementById('item-name').value = '';
            document.getElementById('amount').value = '';
        }

        function exportToPDF() {
            const element = document.querySelector('main');
            html2pdf().from(element).save('Laporan_MyFinance.pdf');
        }

        // Jalankan saat start
        lucide.createIcons();
        updateUI();
    </script>
</body>
</html>
